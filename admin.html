<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>funpx · 管理后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23191919'/%3E%3Cpath d='M9 21.5 16 9l7 12.5' stroke='%23D97757' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .admin-wrap { max-width: 860px; margin: 0 auto; padding: 0 24px; }
  .login-box { max-width: 380px; margin: 90px auto 0; }
  .login-box input, .field input, .field select {
    width: 100%; padding: 9px 12px; border: 1px solid var(--line-strong);
    border-radius: 8px; font: inherit; background: #fff; color: var(--slate);
  }
  .btn {
    display: inline-block; border: 0; cursor: pointer; font: inherit; font-weight: 600;
    padding: 9px 18px; border-radius: 8px; background: var(--ink); color: var(--bone);
  }
  .btn.clay { background: var(--clay); }
  .btn.ghost { background: transparent; color: var(--slate); border: 1px solid var(--line-strong); }
  .btn.small { padding: 4px 12px; font-size: 13px; }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
  .group-editor { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin: 14px 0; }
  .group-editor .row { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .group-editor .row .field { flex: 1 1 160px; }
  .link-row { border-top: 1px dashed var(--line); padding: 10px 0; }
  .link-row .row { margin-bottom: 6px; }
  .link-row:last-child { border-bottom: 1px dashed var(--line); }
  .muted { color: var(--faint); font-size: 13px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin: 18px 0; flex-wrap: wrap; }
  .save-bar { position: sticky; bottom: 0; background: var(--bone); border-top: 1px solid var(--line); padding: 14px 0; margin-top: 22px; display: flex; gap: 12px; align-items: center; }
  .toast { position: fixed; right: 20px; bottom: 80px; background: var(--ink); color: var(--bone); padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .err { color: var(--down); font-size: 13.5px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="mark" href="/">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#191919"/><path d="M9 21.5 16 9l7 12.5" stroke="#D97757" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>funpx 管理</span>
    </a>
    <div class="header-meta"><a class="admin-link" href="/">返回导航</a></div>
  </div>
</header>

<main class="admin-wrap">
  <div id="login-view" class="login-box">
    <h1 style="font-family:Fraunces,serif;font-weight:600;">管理后台</h1>
    <p class="muted">输入管理密钥以编辑导航内容。</p>
    <div class="field"><input type="password" id="key-input" placeholder="管理密钥（sk-…）" autocomplete="off"></div>
    <p class="err" id="login-err"></p>
    <p><button class="btn clay" id="login-btn">解锁</button></p>
  </div>

  <div id="editor-view" style="display:none">
    <h1 style="font-family:Fraunces,serif;font-weight:600;margin:36px 0 4px;">编辑导航</h1>
    <p class="muted">改动保存后立即生效，所有访客可见。</p>

    <div id="groups-editor"></div>

    <div class="toolbar">
      <button class="btn ghost" id="add-group">+ 新增分组</button>
    </div>

    <div class="save-bar">
      <button class="btn clay" id="save-btn">保存全部</button>
      <button class="btn ghost" id="logout-btn">锁定</button>
      <span class="muted" id="save-hint"></span>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var KEY_STORE = "fpxWebNavAdminKey";
  var data = { groups: [] };

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function getKey() { try { return sessionStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
  function setKey(k) { try { k ? sessionStorage.setItem(KEY_STORE, k) : sessionStorage.removeItem(KEY_STORE); } catch (e) {} }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  function field(labelText, value, onChange, placeholder) {
    var wrap = el("div", "field");
    var lab = el("label", null, labelText);
    lab.style.cssText = "display:block;font-size:12px;color:var(--muted);margin-bottom:3px;";
    var input = document.createElement("input");
    input.value = value == null ? "" : value;
    if (placeholder) input.placeholder = placeholder;
    input.addEventListener("input", function () { onChange(input.value); });
    wrap.appendChild(lab);
    wrap.appendChild(input);
    return wrap;
  }

  function renderGroup(group, groupIndex) {
    var box = el("div", "group-editor");

    var headRow = el("div", "row");
    headRow.appendChild(field("分组名称", group.name, function (v) { group.name = v; }));
    headRow.appendChild(field("分组说明", group.desc, function (v) { group.desc = v; }));
    var del = el("button", "btn ghost small", "删除分组");
    del.addEventListener("click", function () {
      if (confirm("删除分组「" + (group.name || "未命名") + "」及其全部链接？")) {
        data.groups.splice(groupIndex, 1);
        renderAll();
      }
    });
    var headBtns = el("div", null); headBtns.style.alignSelf = "flex-end";
    headBtns.appendChild(del);
    headRow.appendChild(headBtns);
    box.appendChild(headRow);

    (group.links || []).forEach(function (link, linkIndex) {
      var rowBox = el("div", "link-row");
      var r1 = el("div", "row");
      r1.appendChild(field("名称", link.name, function (v) { link.name = v; }));
      r1.appendChild(field("网址（https://…）", link.url, function (v) { link.url = v; }));
      rowBox.appendChild(r1);
      var r2 = el("div", "row");
      r2.appendChild(field("描述", link.desc, function (v) { link.desc = v; }));
      r2.appendChild(field("域名标签（可留空自动取域名）", link.host, function (v) { link.host = v; }));
      var delLink = el("button", "btn ghost small", "删除");
      delLink.addEventListener("click", function () {
        group.links.splice(linkIndex, 1);
        renderAll();
      });
      r2.appendChild(delLink);
      rowBox.appendChild(r2);
      box.appendChild(rowBox);
    });

    var addLink = el("button", "btn ghost small", "+ 新增链接");
    addLink.addEventListener("click", function () {
      group.links = group.links || [];
      group.links.push({ name: "", url: "https://", desc: "", host: "" });
      renderAll();
    });
    box.appendChild(addLink);
    return box;
  }

  function renderAll() {
    var host = $("groups-editor");
    host.innerHTML = "";
    data.groups.forEach(function (group, i) { host.appendChild(renderGroup(group, i)); });
  }

  function collect() {
    return { groups: data.groups };
  }

  function load() {
    fetch("/api/links", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { data.groups = (d && d.groups) || []; renderAll(); })
      .catch(function () { toast("加载失败"); });
  }

  function save() {
    $("save-hint").textContent = "保存中…";
    fetch("/api/links", {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Admin-Key": getKey() },
      body: JSON.stringify(collect()),
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.saved) {
          $("save-hint").textContent = "";
          toast("已保存");
        } else if (res.j && res.j.error === "unauthorized") {
          setKey("");
          showLogin();
          toast("密钥失效，请重新解锁");
        } else {
          $("save-hint").textContent = "";
          toast("保存失败: " + ((res.j && res.j.error) || res.ok));
        }
      })
      .catch(function () { $("save-hint").textContent = ""; toast("网络错误"); });
  }

  function showEditor() {
    $("login-view").style.display = "none";
    $("editor-view").style.display = "";
    load();
  }
  function showLogin() {
    $("editor-view").style.display = "none";
    $("login-view").style.display = "";
    $("key-input").value = "";
    $("key-input").focus();
  }

  function tryLogin() {
    var key = $("key-input").value.trim();
    if (!key) return;
    fetch("/api/links", { headers: { "X-Admin-Key": key }, cache: "no-store" })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) {
          setKey(key);
          showEditor();
        } else {
          $("login-err").textContent = "密钥不正确";
        }
      })
      .catch(function () { $("login-err").textContent = "网络错误，请重试"; });
  }

  $("login-btn").addEventListener("click", tryLogin);
  $("key-input").addEventListener("keydown", function (e) { if (e.key === "Enter") tryLogin(); });
  $("save-btn").addEventListener("click", save);
  $("logout-btn").addEventListener("click", function () { setKey(""); showLogin(); });
  $("add-group").addEventListener("click", function () {
    data.groups.push({ id: "g" + Date.now(), name: "新分组", desc: "", links: [] });
    renderAll();
  });

  if (getKey()) {
    fetch("/api/links", { headers: { "X-Admin-Key": getKey() }, cache: "no-store" })
      .then(function (r) { if (r.ok) showEditor(); else showLogin(); })
      .catch(showLogin);
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
