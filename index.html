<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>funpx · 导航</title>
<meta name="description" content="个人服务导航台">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23191919'/%3E%3Cpath d='M9 21.5 16 9l7 12.5' stroke='%23D97757' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="mark" href="/" aria-label="funpx 首页">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#191919"/><path d="M9 21.5 16 9l7 12.5" stroke="#D97757" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>funpx</span>
    </a>
    <div class="header-meta">
      <span class="dot" id="live-dot" aria-hidden="true"></span>
      <span id="live-label"></span>
      <a class="admin-link" href="/admin.html" title="管理后台">管理</a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">个人导航台</p>
    <h1>常用服务，<em>一个入口</em>。</h1>
    <p class="lede" id="lede-text">按用途归组，点开即用。状态标签每 60 秒自动刷新。</p>
  </section>

  <nav class="group-index" id="group-index" aria-label="分组目录"></nav>

  <div id="groups"></div>

  <footer class="site-foot">
    <p>funpx.cn · 由 Caddy 提供 HTTPS · <a href="/admin.html">管理后台</a></p>
  </footer>
</main>

<script>
(function () {
  "use strict";
  var state = { groups: [] };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function probe(url, elStatus) {
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 8000) : null;
    var start = Date.now();
    fetch(url, { mode: "no-cors", cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
      .then(function () {
        if (timer) clearTimeout(timer);
        elStatus.textContent = "在线";
        elStatus.className = "status ok";
        elStatus.title = "响应 " + (Date.now() - start) + " ms";
      })
      .catch(function () {
        if (timer) clearTimeout(timer);
        elStatus.textContent = "离线";
        elStatus.className = "status down";
      });
  }

  function render() {
    var indexNav = document.getElementById("group-index");
    var container = document.getElementById("groups");
    indexNav.innerHTML = "";
    container.innerHTML = "";

    state.groups.forEach(function (group) {
      var gid = String(group.id || group.name).replace(/[^a-zA-Z0-9_-]/g, "");
      var link = el("a", null, group.name);
      link.href = "#" + gid;
      indexNav.appendChild(link);

      var section = el("section", "group");
      section.id = gid;
      var head = el("header", "group-head");
      var h2 = el("h2", null, group.name);
      head.appendChild(h2);
      if (group.desc) head.appendChild(el("p", null, group.desc));
      section.appendChild(head);

      var grid = el("div", "grid");
      (group.links || []).forEach(function (linkItem) {
        var card = el("a", "card");
        card.href = linkItem.url;
        card.target = "_blank";
        card.rel = "noopener";
        var top = el("div", "card-top");
        top.appendChild(el("h3", null, linkItem.name));
        var status = el("span", "status", "…");
        status.setAttribute("data-probe", linkItem.url);
        top.appendChild(status);
        card.appendChild(top);
        if (linkItem.desc) card.appendChild(el("p", null, linkItem.desc));
        card.appendChild(el("span", "host", linkItem.host || ""));
        grid.appendChild(card);
      });
      section.appendChild(grid);
      container.appendChild(section);
    });

    document.querySelectorAll(".status[data-probe]").forEach(function (node) {
      probe(node.getAttribute("data-probe"), node);
    });
  }

  function tick() {
    var probed = document.querySelectorAll(".status[data-probe]");
    var ok = document.querySelectorAll(".status[data-probe].ok").length;
    if (probed.length) {
      document.getElementById("live-label").textContent = ok + " / " + probed.length + " 在线";
      document.getElementById("live-dot").className = "dot" + (ok === probed.length ? " live" : "");
    } else {
      document.getElementById("live-label").textContent = "";
    }
  }

  fetch("/api/links", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      state.groups = (data && data.groups) || [];
      render();
      setTimeout(tick, 8500);
      setInterval(function () {
        document.querySelectorAll(".status[data-probe]").forEach(function (node) {
          probe(node.getAttribute("data-probe"), node);
        });
        setTimeout(tick, 8500);
      }, 60000);
    })
    .catch(function () {
      document.getElementById("lede-text").textContent = "加载失败，请稍后刷新重试。";
    });
})();
</script>
</body>
</html>
